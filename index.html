<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6750A4"><meta name="description" content="OmniPocket — local-first multi-currency wealth tracker."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>OmniPocket</title></head><body><div class="app-shell"><header class="topbar"><button class="icon-button" id="menuButton" aria-label="Open menu">☰</button><div class="brand"><span class="brand-mark">◎</span><span>OmniPocket</span></div><button class="icon-button" id="privacyButton" aria-label="Hide balances">◉</button></header><main class="main-content"><section class="hero-card surface"><div class="eyebrow">GLOBAL NET WORTH</div><div class="hero-row"><div><h1 id="netWorth">₦0</h1><button class="text-button" id="baseCurrencyButton">NGN · Base currency</button></div><div class="pulse-node"><span></span></div></div><div class="hero-meta"><span id="accountCount">0 accounts</span><span>•</span><span id="syncState">Local</span></div></section><section class="widget-grid"><article class="surface widget"><div class="widget-head"><div><span class="eyebrow">FOCUS</span><h2>Goals</h2></div><button class="icon-button small" id="addGoalButton">＋</button></div><div id="goalContent" class="empty-state">Create your first financial target.</div></article><article class="surface widget"><div class="widget-head"><div><span class="eyebrow">MONEY NODES</span><h2>Accounts</h2></div><button class="icon-button small" id="addAccountButton">＋</button></div><div id="accountList" class="stack"></div></article><article class="surface widget"><div class="widget-head"><div><span class="eyebrow">FLOW</span><h2>Recent activity</h2></div></div><div id="activityList" class="stack"></div></article><article class="surface widget"><div class="widget-head"><div><span class="eyebrow">QUICK LOG</span><h2>Move money</h2></div></div><div class="quick-actions"><button data-quick="income">＋ Add money</button><button data-quick="expense">− Spend</button><button data-quick="transfer">⇄ Transfer</button><button data-quick="adjustment">↕ Adjust</button><button data-quick="withdrawal">⇣ Cash out</button></div></article></section></main><button class="fab" id="fab" aria-label="Quick money action">＋</button><nav class="bottom-nav"><button class="nav-item active">⌂<span>Home</span></button><button class="nav-item">◫<span>Accounts</span></button><button class="nav-item">◎<span>Goals</span></button><button class="nav-item">≋<span>Activity</span></button><button class="nav-item">•••<span>More</span></button></nav></div><dialog id="quickDialog" class="modal"><form method="dialog" id="quickForm" class="modal-card"><div class="modal-head"><div><span class="eyebrow">QUICK ENTRY</span><h2 id="quickTitle">Add money</h2></div><button class="icon-button" value="cancel">×</button></div><label>Amount<input id="quickAmount" inputmode="decimal" type="number" min="0" step="0.01" required></label><label>Account<select id="quickAccount" required></select></label><label id="quickCategoryWrap">Category<select id="quickCategory"><option>Food</option><option>Transport</option><option>Utilities</option><option>Shopping</option><option>Other</option></select></label><label>Date<input id="quickDate" type="date"></label><label>Note <span class="muted">(optional)</span><input id="quickNote" maxlength="120" placeholder="What was this?"></label><div class="modal-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" id="quickSave">Save</button></div></form></dialog><dialog id="accountDialog" class="modal"><form method="dialog" id="accountForm" class="modal-card"><div class="modal-head"><div><span class="eyebrow">MONEY NODE</span><h2>New account</h2></div><button class="icon-button" value="cancel">×</button></div><label>Name<input id="accountName" required placeholder="GTBank Savings"></label><label>Institution <span class="muted">(optional)</span><input id="accountInstitution" placeholder="GTBank"></label><label>Type<select id="accountType"><option value="bank">Bank</option><option value="cash">Cash</option><option value="wallet">Digital wallet</option><option value="locked">Locked savings</option></select></label><label>Currency<select id="accountCurrency"><option>NGN</option><option>USD</option><option>GBP</option><option>EUR</option></select></label><label>Current balance<input id="accountBalance" type="number" step="0.01" required value="0"></label><div class="modal-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary">Create account</button></div></form></dialog><script src="app.js"></script></body></html>
