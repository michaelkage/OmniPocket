name: OmniPocket CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check domain.js
          node --check storage.js
          node --check bus.js
          node --check v1-completion.js
          node --check production-hardening.js
          node --check bank-core.js
          node --check architecture.js
          node --check diagnostics.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Domain and architecture tests
        run: npm test
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Required assets
        run: |
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f favicon.svg
      - name: Required integrations present
        run: |
          grep -q "supabase-js" index.html
          grep -q "mono-exchange-token" app.js
          grep -q "mono-account-sync" app.js
          grep -q "omnipocket-payment-initiate" app.js
      - name: No obvious secret leakage
        run: |
          ! grep -RInE 'service_role|sk_live_|sk_test_|MONO_SECRET_KEY=' --exclude-dir=.git --exclude='ci.yml' .
