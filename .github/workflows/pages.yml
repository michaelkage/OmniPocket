name: Deploy OmniPocket to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build identity
        run: echo 'window.OMNIPOCKET_BUILD = "${GITHUB_SHA}";' > _build.js

      - name: Validate site assets
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f favicon.svg
          grep -q '_build.js' index.html
          grep -q 'OmniPocket' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -e
          for i in {1..12}; do
            if curl -fsSL "$SITE_URL" | grep -q "OmniPocket"; then break; fi
            sleep 10
          done

          curl -fsSL "$SITE_URL" | grep -q "OmniPocket"
          curl -fsSL "$SITE_URL/app.js" >/dev/null
          curl -fsSL "$SITE_URL/styles.css" >/dev/null
          curl -fsSL "$SITE_URL/manifest.webmanifest" >/dev/null
          curl -fsSL "$SITE_URL/sw.js" >/dev/null
          curl -fsSL "$SITE_URL/_build.js" | grep -q "$BUILD_SHA"

          echo "GitHub Pages deployment verified: $SITE_URL"
