name: Deploy OmniPocket to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build identity
        run: echo 'window.OMNIPOCKET_BUILD = "${GITHUB_SHA}";' > _build.js

      - name: Validate site assets
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f favicon.svg
          grep -q '_build.js' index.html
          grep -q 'OmniPocket' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -e
          BASE_URL="${SITE_URL%/}"

          fetch_ok() {
            local url="$1"
            for i in {1..12}; do
              if curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "$url" -o /tmp/omnipocket-check; then
                return 0
              fi
              sleep 5
            done
            echo "Failed to fetch $url"
            return 1
          }

          fetch_ok "$BASE_URL/"
          grep -q "OmniPocket" /tmp/omnipocket-check

          for asset in app.js styles.css manifest.webmanifest sw.js; do
            fetch_ok "$BASE_URL/$asset"
          done

          fetch_ok "$BASE_URL/_build.js"
          grep -q "$BUILD_SHA" /tmp/omnipocket-check

          echo "GitHub Pages deployment verified: $BASE_URL"
